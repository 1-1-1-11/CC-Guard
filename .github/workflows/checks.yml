# [INPUT]: 推送到 main 与 PR 的提交、锁定依赖。
# [OUTPUT]: Windows 上的前端测试与构建、界面模拟、Rust 原生测试与 CLI/区域回归，不交付安装包。
# [POS]: 无凭据检查；不签名、不发布、不下载浏览器引擎。mihomo 判卷台需要本机内核，不在 CI 跑。
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    name: Windows
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      # 原生测试只用公开静态资源；浏览器引擎不进 CI。
      TAURI_CONFIG: '{"bundle":{"resources":["../dist/","../browser-runtime/version.txt","../browser-runtime/LICENSE.fingerprint-chromium"]}}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Prepare locked dependencies
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
          bun install --frozen-lockfile
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - name: Frontend tests
        run: bun test
      - name: Frontend build
        run: bun run build
      - name: UI simulation
        run: bun run test:ui
      - name: Accounts UI simulation
        run: bun run test:identities
      - name: Rust native tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --features custom-protocol
      - name: Windows CLI and region regression
        run: python scripts/test-windows.py
