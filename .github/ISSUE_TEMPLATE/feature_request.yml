name: 功能建议 / Feature request
description: 想让 CC-Guard 多做点什么
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 先说场景和痛点，再说方案
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 希望的做法
  - type: textarea
    id: alternatives
    attributes:
      label: 现在是怎么绕过的
