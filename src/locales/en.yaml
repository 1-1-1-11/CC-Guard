"只按域名核对：Clash 没有开启 find-process-mode: always，认不出发起连接的程序。": "Matching by domain only: Clash doesn't have find-process-mode: always, so it can't tell which program made a connection."
漏网连接: Leaked connections
controller 地址为空。: Controller address is empty.
controller 地址格式无效。: Controller address is invalid.
mihomo 拒绝了 secret，读不到配置，已拦住。: mihomo rejected the secret and its config can't be read. Blocked.
mihomo 控制接口返回 HTTP {code}。: mihomo controller returned HTTP {code}.
mihomo 配置响应格式错误。: mihomo config response is malformed.
mihomo 配置响应读取失败。: Couldn't read the mihomo config response.
mihomo 配置响应过大。: mihomo config response is too large.
mihomo 配置里没有分流模式。: mihomo config has no routing mode.
mihomo 配置里的 {key} 缺失或无效。: "{key} in the mihomo config is missing or invalid."
专用端口无效。: Dedicated port is invalid.
专用线路出口为 {first}，与期望一致。: Dedicated line exits at {first}, as expected.
出口查询服务少于 2 个，无法确认。: Fewer than 2 exit lookup services. Can't confirm.
出口查询服务返回的 IP 无效，无法确认。: An exit lookup service returned an invalid IP. Can't confirm.
各查询服务看到的出口不一致（{v0}），已拦住。: Lookup services saw different exits ({v0}). Blocked.
实际出口 {first} 与期望出口 {expected} 不符，已拦住。: Actual exit {first} doesn't match expected {expected}. Blocked.
无法建立 controller 连接。: Can't connect to the controller.
期望出口 IP 格式无效。: Expected exit IP is invalid.
端口 {v0} 是 mihomo 的通用入站端口，会跟着日常分流走，不是 Claude 专用线路，已拦住。: Port {v0} is mihomo's general inbound port and follows everyday routing, not Claude's dedicated line. Blocked.
